[project]
name = "assetatlas"
version = "0.1.0"
description = "Scene-to-asset atlas pipeline for motion graphics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pydantic>=2.8",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pypdf>=5.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
embeddings = ["sentence-transformers>=3.0"]

test = ["pytest>=8.0", "httpx>=0.27"]

[tool.uvicorn]
factory = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetatlas"]
