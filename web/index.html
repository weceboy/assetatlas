<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetAtlas Manual MVP</title><style>body{font:14px system-ui;margin:0;background:#101318;color:#eee}main{max-width:1200px;margin:auto;padding:20px}.tabs,button{display:flex;gap:8px;flex-wrap:wrap}button{display:inline-block;background:#202632;color:#fff;border:1px solid #394252;border-radius:7px;padding:8px 12px;cursor:pointer}.on{background:#5865f2}section{display:none}.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#171c24;border:1px solid #303744;border-radius:10px;padding:14px;margin:12px 0}textarea,input,select{width:100%;box-sizing:border-box;background:#0d1117;color:#eee;border:1px solid #394252;border-radius:7px;padding:9px}textarea{min-height:240px;font:13px monospace}.muted{color:#929aa8}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.asset{background:#171c24;border:1px solid #303744;border-radius:8px;overflow:hidden}.thumb{height:150px;display:grid;place-items:center;background:#222}.thumb img{max-width:100%;max-height:100%}.info{padding:8px}.tag{font-size:11px;background:#293140;border-radius:10px;padding:3px 6px;margin:2px;display:inline-block}.atlas{position:relative;margin:10px auto;background:#222}.cell{position:absolute;border:1px dashed #aaa;display:grid;place-items:center;font-size:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>AssetAtlas</h1><p class="muted">Manual Prompt Chain · HTML/JavaScript only</p><nav class="tabs"><button class="on" data-t="scenes">Scenes</button><button data-t="chain">Prompt Chain</button><button data-t="atlas">Atlas</button><button data-t="library">Library</button></nav>
<section id="scenes" class="show"><div class="grid"><div class="card"><h2>Scene Plan</h2><textarea id="sceneInput" placeholder="Scene 04\nLocation: Warehouse\nRequired elements:\n- smoke\n- sparks\n- light rays"></textarea><button id="makeScene">Breakdown Prompt</button></div><div class="card"><h2>Production Bible</h2><textarea id="bible" placeholder="cinematic realistic, dramatic lighting..."></textarea><button id="makeBible">Bible Prompt</button></div></div><div class="card"><h2>Scene Analysis JSON</h2><textarea id="sceneJson"></textarea><button id="saveSceneJson">Validate & Save</button><p id="sceneStatus" class="muted"></p></div></section>
<section id="chain"><div class="card"><h2>Prompt Chain</h2><p><button data-p="scene">01 Breakdown</button> <button data-p="norm">02 Normalize</button> <button data-p="match">03 Match</button> <button data-p="atlas">04 Atlas</button> <button data-p="gen">05 Generation</button></p><textarea id="prompt"></textarea><button id="copy">Copy</button></div><div class="grid"><div class="card"><h3>Normalization JSON</h3><textarea id="normJson"></textarea><button id="saveNorm">Save</button></div><div class="card"><h3>Match JSON</h3><textarea id="matchJson"></textarea><button id="saveMatch">Save</button></div></div></section>
<section id="atlas"><div class="grid"><div class="card"><h2>Atlas Plan JSON</h2><textarea id="atlasJson" placeholder='{"atlases":[{"atlas_id":"A1","width":2048,"height":2048,"group":"smoke","cells":[{"asset_id":"GEN001","x":0,"y":0,"width":512,"height":512}]}]}'></textarea><button id="saveAtlas">Validate & Render</button></div><div class="card"><h2>Atlas Image</h2><input id="atlasFile" type="file" accept="image/png,image/jpeg,image/webp"><div id="atlasView"></div></div></div><div class="card"><select id="alpha"><option value="native">Native alpha</option><option value="black">Black background → luminance alpha</option><option value="white">White background → inverse luminance alpha</option></select><button id="crop">Extract all cells</button><p id="cropStatus" class="muted"></p></div></section>
<section id="library"><div class="card"><input id="search" placeholder="Search assets"><select id="cat"><option value="">All categories</option><option>fx</option><option>smoke</option><option>sparks</option><option>light</option><option>character</option><option>prop</option><option>background</option></select></div><div id="assets" class="assets"></div></section>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let db,state={v:3,assets:[],scenes:[],sceneAnalysis:null,norm:null,match:null,atlasPlan:null};
function open(){return new Promise((ok,no)=>{let r=indexedDB.open('assetatlas-v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onerror=()=>no(r.error);r.onsuccess=()=>{db=r.result;let q=db.transaction('s').objectStore('s').get('state');q.onsuccess=()=>{if(q.result)state=q.result;render();ok()}}})}function save(){return new Promise((ok,no)=>{let q=db.transaction('s','readwrite').objectStore('s').put(state,'state');q.onsuccess=ok;q.onerror=()=>no(q.error)})}function J(x){try{return JSON.parse(x)}catch(e){alert('JSON error: '+e.message);return null}}function tab(id){$$('section').forEach(x=>x.classList.toggle('show',x.id===id));$$('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===id))}$$('[data-t]').forEach(x=>x.onclick=()=>tab(x.dataset.t));
function pScene(){return `Analyze this scene plan for reusable motion-graphics assets. Return ONLY JSON: {project,scenes:[{scene_id,assets:[{requirement_id,name,canonical_type,description,category,subcategory,priority,quantity,reusable,variant,style,orientation,tags,scene_id}]}]}.\nPRODUCTION BIBLE:\n${$('#bible').value}\nSCENE PLAN:\n${$('#sceneInput').value}`}function pNorm(){return `Normalize and deduplicate these scene requirements. Minimize unique generation. Return ONLY JSON: {asset_families:[{family_id,name,category,members,generate_count,variants,reusable,scenes}],generation_items:[{generation_id,family_id,name,variant,quantity,priority,scenes,tags,style,description}]}.\n${JSON.stringify(state.sceneAnalysis)}`}function pMatch(){return `Compare required assets against this existing library. Decide REUSE, VARIANT or GENERATE. Return ONLY {reuse:[],variants:[],generate:[]}.\nLIBRARY:${JSON.stringify(state.assets.map(a=>{let b={...a};delete b.blob;return b}))}\nREQUIREMENTS:${JSON.stringify(state.norm)}`}function pAtlas(){return `Plan efficient visual atlases. Group compatible assets; separate characters and backgrounds. Use 2048 or 4096 square. Every cell needs asset_id,x,y,width,height,padding. Return ONLY {atlases:[{atlas_id,width,height,group,cells:[]}]}.\n${JSON.stringify(state.match?.generate||[])}`}function pGen(){return `Create a production-ready image prompt for this atlas. Isolated elements, no overlap, generous spacing, full elements, consistent scale, no text, labels, borders or frames. Preserve soft edges for smoke/fog/glow/light. Return FINAL PROMPT and NEGATIVE PROMPT.\nBIBLE:${$('#bible').value}\nPLAN:${JSON.stringify(state.atlasPlan)}`}let P={scene:pScene,norm:pNorm,match:pMatch,atlas:pAtlas,gen:pGen};$$('[data-p]').forEach(x=>x.onclick=()=>$('#prompt').value=P[x.dataset.p]());$('#makeScene').onclick=()=>{$('#prompt').value=pScene();tab('chain')};$('#makeBible').onclick=()=>{$('#prompt').value='Create a concise production bible as JSON with visual_style,color_language,lighting,camera_language,fx_language,character_style,environment_style,resolution,preferred_asset_types.\n'+$('#bible').value;tab('chain')};$('#copy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('#prompt').value);
$('#saveSceneJson').onclick=async()=>{let j=J($('#sceneJson').value);if(!j||!Array.isArray(j.scenes))return alert('scenes[] required');state.sceneAnalysis=j;await save();$('#sceneStatus').textContent='Scene analysis saved.'};$('#saveNorm').onclick=async()=>{let j=J($('#normJson').value);if(!j||!Array.isArray(j.generation_items))return alert('generation_items[] required');state.norm=j;await save();alert('Saved')};$('#saveMatch').onclick=async()=>{let j=J($('#matchJson').value);if(!j||!Array.isArray(j.generate))return alert('generate[] required');state.match=j;await save();alert('Saved')};
function renderPlan(){let root=$('#atlasView');root.innerHTML='';for(let a of state.atlasPlan?.atlases||[]){let s=600/a.width,d=document.createElement('div');d.className='atlas';d.style.width='600px';d.style.height=a.height*s+'px';for(let c of a.cells||[]){let e=document.createElement('div');e.className='cell';e.style.left=c.x*s+'px';e.style.top=c.y*s+'px';e.style.width=c.width*s+'px';e.style.height=c.height*s+'px';e.textContent=c.asset_id;d.appendChild(e)}root.appendChild(d)}}$('#saveAtlas').onclick=async()=>{let j=J($('#atlasJson').value);if(!j||!Array.isArray(j.atlases))return alert('atlases[] required');state.atlasPlan=j;await save();renderPlan()};let image=null;$('#atlasFile').onchange=e=>{let u=URL.createObjectURL(e.target.files[0]),im=new Image();im.onload=()=>{image=im;$('#cropStatus').textContent=`Atlas ${im.naturalWidth}×${im.naturalHeight} loaded`;URL.revokeObjectURL(u)};im.src=u};function alphaCanvas(c,m){if(m==='native')return c;let x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let l=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];p[i+3]=m==='black'?l:255-l}x.putImageData(d,0,0);return c}async function extract(a){let n=0,m=$('#alpha').value;for(let c of a.cells||[]){let cv=document.createElement('canvas');cv.width=c.width;cv.height=c.height;cv.getContext('2d').drawImage(image,c.x,c.y,c.width,c.height,0,0,c.width,c.height);alphaCanvas(cv,m);let blob=await new Promise(r=>cv.toBlob(r,'image/png'));state.assets.push({id:crypto.randomUUID(),filename:(c.asset_id||'asset_'+n).replace(/[^a-z0-9_-]/gi,'_').toLowerCase()+'.png',name:c.asset_id,category:a.group,tags:[a.group],width:c.width,height:c.height,alpha:true,status:m==='native'?'PROCESSED':'PROCESSED_ALPHA_BASELINE',source:'manual_ai_atlas',atlas_id:a.atlas_id,scenes:[],created_at:new Date().toISOString(),blob});n++}return n}$('#crop').onclick=async()=>{if(!image||!state.atlasPlan)return alert('Load atlas and plan first');let n=0;for(let a of state.atlasPlan.atlases||[])n+=await extract(a);await save();render();$('#cropStatus').textContent=n+' assets extracted.'};
function render(){let q=($('#search')?.value||'').toLowerCase(),c=$('#cat')?.value||'';$('#assets').innerHTML=state.assets.filter(a=>(!c||a.category===c)&&(!q||JSON.stringify(a).toLowerCase().includes(q))).map(a=>`<article class="asset"><div class="thumb"><img src="${a.blob?URL.createObjectURL(a.blob):''}"></div><div class="info"><b>${a.filename}</b><br>${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}<div class="muted">${a.width}×${a.height} · ${a.status}</div></div></article>`).join('')||'<p class="muted">No assets yet.</p>'}$('#search').oninput=render;$('#cat').onchange=render;open();
</script></main></html>
